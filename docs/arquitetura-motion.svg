<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1562" width="1000" height="1562" font-family="'Segoe UI Variable Display','Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F3EEFF"/><stop offset="0.55" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E9F7FF"/></linearGradient>
<linearGradient id="trail" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7B5CFF" stop-opacity="0"/><stop offset="1" stop-color="#7B5CFF" stop-opacity="0.2"/></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#1B1F3B" flood-opacity="0.16"/></filter>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="22"/></filter>
<marker id="ar" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L11 6 L1 11 z" fill="#1B1F3B"/></marker>
</defs>
<rect width="1000" height="1562" fill="url(#bg)"/>
<circle cx="930" cy="110" r="160" fill="#FF7AC6" opacity="0.14" filter="url(#glow)"/>
<circle cx="70" cy="1432" r="180" fill="#2F9BFF" opacity="0.13" filter="url(#glow)"/>
<rect x="-60" y="656.04" width="700" height="28" rx="14" fill="url(#trail)" transform="rotate(-12 300 656.04)"/>
<rect x="520" y="1462" width="600" height="24" rx="12" fill="url(#trail)" transform="rotate(-12 800 1462)"/>
<text x="50" y="85" font-size="42" fill="#1B1F3B" font-weight="800" text-anchor="start"><tspan x="50" dy="0">Claude comanda a estratégia; o AGY</tspan><tspan x="50" dy="52">executa na cota Gemini</tspan></text><text x="52" y="177" font-size="24" fill="#5B6286" font-weight="400" text-anchor="start"><tspan x="52" dy="0">Ponte claude-agy — delegação em workspace isolado e revisão por</tspan><tspan x="52" dy="32">segunda família</tspan></text><g filter="url(#sh)"><rect x="50" y="255" width="900" height="151.2" rx="24" fill="#fff"/><rect x="50" y="255" width="12" height="151.2" rx="6" fill="#7B5CFF"/></g><text x="82" y="303.95" font-size="27" fill="#1B1F3B" font-weight="800" text-anchor="start"><tspan x="82" dy="0">IA COMANDANTE · Claude Code (Opus / Sonnet)</tspan></text><text x="82" y="342.5" font-size="23" fill="#3C4268" font-weight="400" text-anchor="start"><tspan x="82" dy="0">Preserva o contexto principal do repositório, define tarefas, decide</tspan><tspan x="82" dy="31.05">a arquitetura técnica e aciona comandos /argon:* sob demanda.</tspan></text><line x1="500" y1="430.2" x2="500" y2="495.2" stroke="#1B1F3B" stroke-width="6" stroke-dasharray="3 12" stroke-linecap="round" marker-end="url(#ar)"/><circle cx="500" cy="621.2" r="116" fill="#1B1F3B" stroke="#fff" stroke-width="8" filter="url(#sh)"/><text x="500" y="611.2" font-size="22" fill="#fff" font-weight="900" text-anchor="middle"><tspan x="500" dy="0">CLAUDE → AGY</tspan></text><text x="500" y="643.2" font-size="17" fill="#fff" font-weight="600" text-anchor="middle"><tspan x="500" dy="0">CLI agy · argon-ws</tspan></text><line x1="500" y1="761.2" x2="500" y2="826.2" stroke="#1B1F3B" stroke-width="6" stroke-dasharray="3 12" stroke-linecap="round" marker-end="url(#ar)"/><g filter="url(#sh)"><rect x="50.0" y="846.2" width="441.0" height="270.1" rx="24" fill="#fff"/><rect x="50.0" y="846.2" width="12" height="270.1" rx="6" fill="#2F9BFF"/></g><text x="82.0" y="894.3000000000001" font-size="26" fill="#1B1F3B" font-weight="800" text-anchor="start"><tspan x="82.0" dy="0">/argon:revisar &amp;</tspan><tspan x="82.0" dy="33.800000000000004">/argon:desafiar</tspan></text><text x="82.0" y="965.4000000000001" font-size="22" fill="#3C4268" font-weight="400" text-anchor="start"><tspan x="82.0" dy="0">Auditoria independente de diffs</tspan><tspan x="82.0" dy="29.700000000000003">e planos arquiteturais por</tspan><tspan x="82.0" dy="29.700000000000003">segunda família técnica (Gemini</tspan><tspan x="82.0" dy="29.700000000000003">4 Argon) com achados</tspan><tspan x="82.0" dy="29.700000000000003">estruturados.</tspan></text><g filter="url(#sh)"><rect x="509.0" y="846.2" width="441.0" height="270.1" rx="24" fill="#fff"/><rect x="509.0" y="846.2" width="12" height="270.1" rx="6" fill="#16C79A"/></g><text x="541.0" y="894.3000000000001" font-size="26" fill="#1B1F3B" font-weight="800" text-anchor="start"><tspan x="541.0" dy="0">/argon:explorar &amp;</tspan><tspan x="541.0" dy="33.800000000000004">/argon:pesquisar</tspan></text><text x="541.0" y="965.4000000000001" font-size="22" fill="#3C4268" font-weight="400" text-anchor="start"><tspan x="541.0" dy="0">Mapeamento amplo de</tspan><tspan x="541.0" dy="29.700000000000003">repositórios, leitura de bases</tspan><tspan x="541.0" dy="29.700000000000003">e pesquisa web com fontes</tspan><tspan x="541.0" dy="29.700000000000003">citadas economizando tokens</tspan><tspan x="541.0" dy="29.700000000000003">preciosos da janela do Opus.</tspan></text><g filter="url(#sh)"><rect x="50.0" y="1134.3000000000002" width="441.0" height="270.1" rx="24" fill="#fff"/><rect x="50.0" y="1134.3000000000002" width="12" height="270.1" rx="6" fill="#FF5A6E"/></g><text x="82.0" y="1182.4" font-size="26" fill="#1B1F3B" font-weight="800" text-anchor="start"><tspan x="82.0" dy="0">/argon:delegar &amp;</tspan><tspan x="82.0" dy="33.800000000000004">/argon:perguntar</tspan></text><text x="82.0" y="1253.5" font-size="22" fill="#3C4268" font-weight="400" text-anchor="start"><tspan x="82.0" dy="0">Execução em diretório de</tspan><tspan x="82.0" dy="29.700000000000003">trabalho temporário limpo</tspan><tspan x="82.0" dy="29.700000000000003">(argon-ws), retornando ao</tspan><tspan x="82.0" dy="29.700000000000003">Claude Code apenas patches</tspan><tspan x="82.0" dy="29.700000000000003">auditáveis e síntese limpa.</tspan></text><g filter="url(#sh)"><rect x="509.0" y="1134.3000000000002" width="441.0" height="236.3" rx="24" fill="#fff"/><rect x="509.0" y="1134.3000000000002" width="12" height="236.3" rx="6" fill="#FFB300"/></g><text x="541.0" y="1182.4" font-size="26" fill="#1B1F3B" font-weight="800" text-anchor="start"><tspan x="541.0" dy="0">Gestão Inteligente de Cota</tspan></text><text x="541.0" y="1219.7" font-size="22" fill="#3C4268" font-weight="400" text-anchor="start"><tspan x="541.0" dy="0">Aproveita janelas amplas do</tspan><tspan x="541.0" dy="29.700000000000003">plano Google Ultra/Pro e recua</tspan><tspan x="541.0" dy="29.700000000000003">automaticamente de Argon para</tspan><tspan x="541.0" dy="29.700000000000003">Flash em caso de limite de</tspan><tspan x="541.0" dy="29.700000000000003">taxa.</tspan></text><g filter="url(#sh)"><rect x="50" y="1422.4" width="900" height="90.1" rx="28" fill="#1B1F3B"/></g><text x="500.0" y="1465.4" font-size="23" fill="#fff" font-weight="800" text-anchor="middle"><tspan x="500.0" dy="0">Duas famílias de IA cooperando: quem comanda preserva contexto; quem</tspan><tspan x="500.0" dy="31.05">opera multiplica cota e rigor.</tspan></text>
</svg>