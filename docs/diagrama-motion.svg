  <rect x="660" y="395" width="260" height="110" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><rect x="672" y="405" width="115" height="18" rx="9" fill="#EDE9FE"/><text x="729" y="418" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="10" font-weight="800" fill="#6D28D9" text-anchor="middle">Isolamento Estrito</text><text x="672" y="441" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#1B1F3B">Workspace argon-ws</text><text x="672" y="459" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="10" font-weight="400" fill="#475569"><tspan x="672" dy="0">Trabalho sujo e geração de</tspan><tspan x="672" dy="15">arquivos intermediários isolados</tspan><tspan x="672" dy="15">em cópia de trabalho segura.</tspan></text>
