  <rect x="80" y="395" width="260" height="110" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><rect x="92" y="405" width="115" height="18" rx="9" fill="#EDE9FE"/><text x="149" y="418" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="10" font-weight="800" fill="#6D28D9" text-anchor="middle">/argon:desafiar</text><text x="92" y="441" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#1B1F3B">Auditoria de Planos</text><text x="92" y="459" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="10" font-weight="400" fill="#475569"><tspan x="92" dy="0">Submete planos a uma segunda</tspan><tspan x="92" dy="15">família técnica (Argon) para</tspan><tspan x="92" dy="15">apontar pontos cegos de design.</tspan></text>
  <rect x="372" y="403" width="260" height="110" rx="14" fill="#1B1F3B" fill-opacity="0.06"/>
  <rect x="371" y="399" width="260" height="110" rx="14" fill="#1B1F3B" fill-opacity="0.05"/>
  <rect x="370" y="395" width="260" height="110" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><rect x="382" y="405" width="115" height="18" rx="9" fill="#EDE9FE"/><text x="439" y="418" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="10" font-weight="800" fill="#6D28D9" text-anchor="middle">Varredura 1M Tokens</text><text x="382" y="441" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#1B1F3B">Pesquisa em Contexto Amplo</text><text x="382" y="459" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="10" font-weight="400" fill="#475569"><tspan x="382" dy="0">Gemini 3.8 Flash analisa</tspan><tspan x="382" dy="15">bases volumosas sem consumir</tspan><tspan x="382" dy="15">a janela de contexto do Claude.</tspan></text>
  <rect x="662" y="403" width="260" height="110" rx="14" fill="#1B1F3B" fill-opacity="0.06"/>
