  <text x="125" y="848" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">Claude Code permanece comandante absoluto, usando a potência do ecossistema Google como operária técnica.</text>
