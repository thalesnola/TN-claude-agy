  <rect x="60" y="36" width="354.0" height="26" rx="13" fill="#EDE9FE" stroke="#DDD6FE" stroke-width="1"/>
  <text x="237.0" y="53" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#6D28D9" text-anchor="middle" letter-spacing="0.5">INTEGRAÇÃO ENTRE IAS · COMANDANTE E OPERÁRIA</text><text x="60" y="86" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="26" font-weight="800" fill="#1B1F3B">TN-claude-agy · Claude Code Comanda o Antigravity</text><text x="60" y="114" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="14" font-weight="500" fill="#4A5568">Plugin para Claude Code delegar tarefas ao AGY (Gemini 4 Argon e Flash) em workspace isolado.</text>
  <rect x="122" y="158" width="760" height="75" rx="18" fill="#1B1F3B" fill-opacity="0.06"/>
  <rect x="121" y="154" width="760" height="75" rx="18" fill="#1B1F3B" fill-opacity="0.05"/>
  <rect x="120" y="150" width="760" height="75" rx="18" fill="#1E293B" stroke="#334155" stroke-width="1.5"/><rect x="140" y="162" width="130" height="20" rx="10" fill="#DBEAFE"/><text x="205" y="176" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="10" font-weight="800" fill="#1D4ED8" text-anchor="middle">IA COMANDANTE</text><text x="285" y="177" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">Claude Code (Claude Opus 5.5 / Sonnet)</text><text x="140" y="206" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">Interage com o usuário, comanda a arquitetura e despacha desafios técnicos via slash command.</text><line x1="500" y1="225" x2="500" y2="243" stroke="#6366F1" stroke-width="2.5" stroke-dasharray="5,4"/>
