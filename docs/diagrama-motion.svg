  <text x="96" y="655" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#1B1F3B">/argon:desafiar plano.md</text>
  <text x="96" y="675" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#475569"><tspan x="96" dy="0">Claude Code cria um plano</tspan><tspan x="96" dy="16">complexo e invoca o AGY via</tspan><tspan x="96" dy="16">slash command nativo no terminal.</tspan></text>
  
