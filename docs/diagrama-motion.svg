  <text x="686" y="655" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#1B1F3B">Síntese sem Gasto de Cota</text>
  <text x="686" y="675" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#475569"><tspan x="686" dy="0">Claude recebe parecer executivo</tspan><tspan x="686" dy="16">lapidado pelo Argon com zero</tspan><tspan x="686" dy="16">consumo de sua própria janela.</tspan></text>
