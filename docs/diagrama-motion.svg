  <text x="391" y="675" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#475569"><tspan x="391" dy="0">AGY instancia Gemini 4 Argon</tspan><tspan x="391" dy="16">em argon-ws, simula falhas de borda</tspan><tspan x="391" dy="16">e redige contra-argumentos.</tspan></text>
  
